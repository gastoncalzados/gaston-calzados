<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gastón Calzados</title>

<style>

/* ================================
   CONFIGURACIÓN GENERAL
================================ */

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(255,255,255,0.55),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #fff8c9,
            #ffe36b
        );

    color: #555;
}


/* ================================
   PÁGINA
================================ */

.pagina {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px 12px;
}


/* ================================
   TARJETA BLANCA
================================ */

.tarjeta {

    width: 100%;

    max-width: 790px;

    background: white;

    border-radius: 55px;

    padding: 55px 45px 45px;

    text-align: center;

    box-shadow:
        0 15px 45px rgba(0,0,0,0.12);
}


/* ================================
   LOGO
   TODO ESTÁ DENTRO DEL HTML
================================ */

.logo {

    width: 300px;

    height: 300px;

    margin: 0 auto 20px;

    border-radius: 50%;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #f7d900,
            #ffed24
        );

    box-shadow:
        inset 0 0 0 8px #e9bd00;
}


/* CÍRCULO AZUL DEL LOGO */

.logo::before {

    content: "";

    position: absolute;

    width: 225px;

    height: 225px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #25a9ec,
            #087ac1 70%
        );

    box-shadow:
        inset 0 0 0 7px #0877b8;

}


/* TEXTO DEL LOGO */

.logo-texto {

    position: relative;

    z-index: 2;

    color: white;

    font-size: 52px;

    font-weight: 300;

    letter-spacing: -3px;

    margin-top: -10px;
}


/* CALZADOS */

.logo-calzados {

    position: absolute;

    z-index: 3;

    top: 158px;

    left: 50%;

    transform: translateX(-50%);

    background: white;

    color: #1688c7;

    font-size: 21px;

    font-weight: bold;

    letter-spacing: 5px;

    padding: 4px 9px;

    white-space: nowrap;
}


/* ================================
   TÍTULO
================================ */

h1 {

    margin: 0 0 15px;

    color: #1688c7;

    font-size: 55px;

    font-weight: bold;
}


/* ================================
   SUBTÍTULO
================================ */

.subtitulo {

    margin: 0 0 55px;

    color: #5f5f5f;

    font-size: 29px;

    line-height: 1.4;
}


/* ================================
   BOTONES
================================ */

.sucursales {

    display: flex;

    flex-direction: column;

    gap: 30px;
}


.boton {

    width: 100%;

    min-height: 175px;

    padding: 25px 30px;

    border-radius: 34px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 20px;

    text-decoration: none;

    color: white;

    background:
        linear-gradient(
            135deg,
            #218fca,
            #1582bd
        );

    box-shadow:
        0 12px 25px rgba(20,130,190,0.20);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


/* EFECTO AL PASAR EL MOUSE */

.boton:hover {

    transform: translateY(-4px);

    box-shadow:
        0 18px 30px rgba(20,130,190,0.28);
}


/* EFECTO AL HACER CLICK */

.boton:active {

    transform: scale(0.98);
}


/* ================================
   PIN
================================ */

.pin {

    font-size: 38px;

    line-height: 1;
}


/* ================================
   INFORMACIÓN
================================ */

.info {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 12px;
}


.info strong {

    font-size: 39px;

    line-height: 1;
}


.info span {

    font-size: 30px;

    line-height: 1.2;
}


/* ================================
   TEXTO INFERIOR
================================ */

.ubicacion {

    margin-top: 42px;

    margin-bottom: 0;

    color: #888;

    font-size: 24px;
}


.gracias {

    margin-top: 18px;

    color: #1688c7;

    font-size: 27px;

    font-weight: bold;
}


/* ================================
   CELULARES
================================ */

@media (max-width: 600px) {

    .pagina {

        padding: 15px 8px;

        align-items: flex-start;
    }


    .tarjeta {

        border-radius: 38px;

        padding: 30px 17px 30px;
    }


    .logo {

        width: 220px;

        height: 220px;

        margin-bottom: 18px;
    }


    .logo::before {

        width: 165px;

        height: 165px;
    }


    .logo-texto {

        font-size: 39px;
    }


    .logo-calzados {

        top: 115px;

        font-size: 15px;

        letter-spacing: 3px;
    }


    h1 {

        font-size: 39px;

        margin-bottom: 12px;
    }


    .subtitulo {

        font-size: 21px;

        margin-bottom: 35px;

        line-height: 1.4;
    }


    .sucursales {

        gap: 18px;
    }


    .boton {

        min-height: 135px;

        padding: 18px 12px;

        border-radius: 27px;

        gap: 12px;
    }


    .pin {

        font-size: 28px;
    }


    .info {

        gap: 8px;
    }


    .info strong {

        font-size: 28px;
    }


    .info span {

        font-size: 21px;
    }


    .ubicacion {

        margin-top: 30px;

        font-size: 17px;
    }


    .gracias {

        font-size: 21px;

        margin-top: 16px;
    }

}

</style>

</head>


<body>


<div class="pagina">


    <div class="tarjeta">


        <!-- =================================
             LOGO
        ================================== -->

        <div class="logo">

            <div class="logo-texto">
                gaston
            </div>

            <div class="logo-calzados">
                CALZADOS
            </div>

        </div>


        <!-- =================================
             TÍTULO
        ================================== -->

        <h1>
            Gastón Calzados
        </h1>


        <p class="subtitulo">

            Elegí tu sucursal y abrí la ubicación en
            <br>

            Google Maps

        </p>


        <!-- =================================
             SUCURSALES
        ================================== -->

        <div class="sucursales">


            <!-- SUCURSAL 1 -->

            <a
                class="boton"
                href="https://www.google.com/maps/search/?api=1&query=Mendoza+655%2C+San+Miguel+de+Tucum%C3%A1n%2C+Tucum%C3%A1n%2C+Argentina"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="pin">
                    📍
                </span>

                <div class="info">

                    <strong>
                        Sucursal 1
                    </strong>

                    <span>
                        Mendoza 655
                    </span>

                </div>

            </a>



            <!-- SUCURSAL 2 -->

            <a
                class="boton"
                href="https://www.google.com/maps/search/?api=1&query=24+de+Septiembre+266%2C+San+Miguel+de+Tucum%C3%A1n%2C+Tucum%C3%A1n%2C+Argentina"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="pin">
                    📍
                </span>

                <div class="info">

                    <strong>
                        Sucursal 2
                    </strong>

                    <span>
                        24 de Septiembre 266
                    </span>

                </div>

            </a>



            <!-- SUCURSAL 3 -->

            <a
                class="boton"
                href="https://www.google.com/maps/search/?api=1&query=24+de+Septiembre+282%2C+San+Miguel+de+Tucum%C3%A1n%2C+Tucum%C3%A1n%2C+Argentina"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="pin">
                    📍
                </span>

                <div class="info">

                    <strong>
                        Sucursal 3
                    </strong>

                    <span>
                        24 de Septiembre 282
                    </span>

                </div>

            </a>


        </div>


        <!-- =================================
             PARTE INFERIOR
        ================================== -->

        <p class="ubicacion">

            Gastón Calzados · San Miguel de Tucumán

        </p>


        <p class="gracias">

            ¡Gracias por confiar en nosotros! 💙

        </p>


    </div>

</div>


</body>

</html>
