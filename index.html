<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gastón Calzados - WhatsApp</title>
<style>
  /* Estilos para replicar la tarjeta física */
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f0f0f0; /* Fondo grisáceo para que resalte la "tarjeta" */
    display: flex;
    justify-content: center;
  }

  .tarjeta-contenedor {
    width: 100%;
    max-width: 480px; /* Ancho máximo para que se vea bien en celular */
    height: 100%;
    background-color: #ffc107; /* Color de fondo amarillo de la tarjeta */
    background-image: radial-gradient(circle, rgba(255,255,255,0.8) 10%, transparent 11%);
    background-size: 30px 30px; /* Patrón de burbujas */
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }

  /* Sección superior (NFC y texto) */
  .top-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 40px;
    text-align: center;
    color: #0d3f7a; /* Azul oscuro */
  }

  .nfc-icon {
    width: 40px;
    height: 40px;
    margin-bottom: 10px;
  }

  .main-title {
    font-size: 28px;
    font-weight: 900;
    margin: 0 20px 10px 20px;
    text-transform: uppercase;
    line-height: 1.1;
  }

  .subtitle {
    font-size: 16px;
    margin: 0 20px;
    font-weight: 600;
  }

  /* Área central (Logo grande) */
  .logo-container {
    display: flex;
    justify-content: center;
    position: relative;
    height: 180px; /* Espacio que ocupa el logo */
    margin-bottom: -90px; /* Para que el logo baje y se superponga */
    z-index: 10;
  }

  .logo-circle {
    width: 180px;
    height: 180px;
    background-color: #0d3f7a; /* Azul oscuro */
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    border: 4px solid white;
  }

  .logo-text-gaston {
    font-family: 'Brush Script MT', cursive; /* Símil manuscrita */
    font-size: 55px;
    color: white;
    margin-top: -10px;
    line-height: 1;
  }
  
  /* Intentando replicar la tipografía exacta de la foto */
  .logo-text-gaston {
    font-family: "Times New Roman", Times, serif; /* Es unaserifa muy específica en el logo, usaremos esto como base */
    font-weight: bold;
    font-size: 60px;
    letter-spacing: -2px;
  }

  .logo-text-calzados {
    font-size: 14px;
    color: white;
    letter-spacing: 3px;
    font-weight: bold;
    margin-top: -5px;
  }

  /* Sección inferior (Instrucciones, QR y Gracias) */
  .bottom-section {
    background-color: white;
    border-top-left-radius: 30px;
    border-top-right-radius: 30px;
    padding: 110px 20px 20px 20px; /* Mucho padding arriba para el logo */
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    color: #333;
  }

  .instructions-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
    width: 100%;
  }

  .phone-icon {
    width: 60px;
    height: auto;
  }

  .instruction-text {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    flex: 1;
    text-align: left;
  }

  /* Estilo de las sucursales (añadida la 3) */
  .sucursales-list {
    width: 100%;
    text-align: left;
    margin-bottom: 20px;
    font-size: 14px;
    color: #555;
    line-height: 1.6;
    border-top: 1px solid #eee;
    padding-top: 15px;
  }
  
  .sucursales-list strong {
    color: #0d3f7a;
    font-size: 15px;
  }

  /* Estilo del QR (usando el mismo QR de la imagen de ejemplo) */
  .qr-code {
    width: 120px;
    height: 120px;
    margin-bottom: 20px;
  }

  /* Franja azul final */
  .footer-bar {
    background-color: #0d3f7a;
    color: white;
    padding: 15px;
    text-align: center;
    font-weight: bold;
    margin-top: auto; /* Se asegura de ir al fondo */
  }

  .thanks-text {
    font-size: 20px;
    font-style: italic; /* Símil manuscrita */
    font-family: Georgia, serif;
  }
  
  .small-thanks {
    font-size: 10px;
    letter-spacing: 1px;
    margin-top: 2px;
    opacity: 0.8;
  }
</style>
</head>
